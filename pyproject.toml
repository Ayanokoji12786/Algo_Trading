[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
description = "Research system for testing a multi-asset time-series momentum hypothesis against realistic costs, point-in-time data, and out-of-sample validation."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
# Vendor SDKs are optional: only install the one(s) you actually use. The
# adapters in trading_system/brokers/ import these lazily, so the core
# package works with none of them installed (e.g. against synthetic data or
# a generic CSV vendor).
zerodha = ["kiteconnect>=5.0"]
angelone = ["smartapi-python>=1.4", "pyotp>=2.9"]
indmoney = ["requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
